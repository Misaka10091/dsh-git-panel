name: npm-publish

# This fork has no Trusted Publisher configured yet. Publishing is an explicit
# manual action after the package name and repository ownership are established.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Test package
        run: npm test
      - name: Publish package through configured OIDC publisher
        run: npm publish --access public
