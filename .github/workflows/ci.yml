name: ci

# Test the host API, client contracts, graph and repository discovery.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check entry syntax
        run: npm run check:syntax
      - name: Run tests
        run: npm test
      - name: Check package contents
        run: npm pack --dry-run
